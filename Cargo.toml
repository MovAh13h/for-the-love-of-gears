[package]
name = "for_the_love_of_gears"
version = "0.1.2"
edition = "2024"
description = "ISO-standard involute gear geometry: spur and helical gears, tooth profile, contact ratio, backlash, and multi-stage kinematic simulation."
license = "MIT"
keywords = ["gear", "mechanical", "engineering", "iso", "geometry"]
categories = ["science", "mathematics"]
repository = "https://github.com/MovAh13h/for-the-love-of-gears"
homepage = "https://github.com/MovAh13h/for-the-love-of-gears"
documentation = "https://docs.rs/for_the_love_of_gears"
readme = "README.md"

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
